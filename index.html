/* ---------------- Julius & Vincent (Home) ---------------- */
Q('vincent_is_an_idiot', { title: 'Vincent is an Idiot!', giver: 'julius', reward: R_(100, 20),
  objectives: [buy('armorsmith', 'An Armorsmith can be purchased from the store.'), fin('armorsmith', 'Complete Armorsmith', 'Complete the Armorsmith by clicking on the foundation.')],
  text: { offer: 'We heard that you got this old kingdom up and running again, we’re here to work! Build me an Armorsmith and I’ll get to it!', prog: 'The Armorsmith foundation is in the Store.', done: 'Now let’s make you some armor.' } });
Q('gear_up', { title: 'Gear Up!', giver: 'julius', pre: ['vincent_is_an_idiot'], reward: R_(200, 30),
  objectives: [{ t: 'craft', slot: 'armor', label: 'Craft a Copper Toned Tunic', desc: 'Armor can be crafted at the Armorsmith.', icon: 'tunic' }],
  text: { offer: 'Get the materials together that you’ll need and we’ll get to work on your new armor!', prog: 'The Armorsmith.', done: 'Fits like a glove. A tunic-shaped glove.' } });
Q('julius_is_an_idiot', { title: 'Julius is an Idiot!', giver: 'vincent', level: 8, reward: R_(100, 20),
  objectives: [buy('workshop', 'A workshop can be purchased from the store.'), fin('workshop', 'Complete Workshop', 'Complete the Workshop by clicking on the foundation.')],
  text: { offer: 'If you are rebuilding this once mighty kingdom, you’re gonna need a workshop! Build one and let’s get to work!', prog: 'A Workshop foundation, from the Store.', done: 'Much better than anything Julius would build.' } });
Q('tailor_made_1', { title: 'Tailor Made I', giver: 'vincent', pre: ['julius_is_an_idiot'], reward: R_(75, 0),
  objectives: [buy('tailor', 'A tailor can be purchased from the store.'), fin('tailor', 'Complete the Tailor', 'Complete the Tailor by clicking on the foundation.')],
  text: { offer: 'I also dabble in tailoring. Build me a tailor and I’ll show you how to customize your gear.', prog: 'A Tailor foundation.', done: 'Lovely.' } });
Q('tailor_made_2', { title: 'Tailor Made II', giver: 'vincent', pre: ['tailor_made_1'], reward: R_(75, 1000),
  objectives: [{ t: 'event', name: 'tailor', n: 1, label: 'Alter an item at the Tailor', desc: 'Click on your Tailor to alter a piece of equipment', icon: 'thread' }],
  text: { offer: 'Alter what you are wearing to that item I just gave you. Hover over any part of the tailor screen for tool tips!', prog: 'Click your Tailor.', done: 'Very fashionable.' } });

/* ---------------- Mrs. Finch (her farm in Goblin Falls) & Crazy Man (Forsaken Caves 1) ---------------- */
Q('foul_beasts', { title: 'Foul Beasts!', giver: 'mrs_finch', level: 1, reward: R_(100, 20),
  objectives: [{ t: 'kill', enemy: 'rabid_hare', n: 4, label: 'Kill 4 Rabid Hares', desc: 'Rabid Hares can be found roaming the land.', icon: 'enemy:rabid_hare' },
    { t: 'have', item: 'fur', n: 2, label: 'Find 2 Fur', desc: 'Fur can be found on Rabid Hares and various creatures.', icon: 'fur' }, back('mrs_finch', 'Mrs. Finch can be found wandering about.')],
  note: 'Window says she wanders the home realm; later windows place her at her farm in Goblin Falls, where she stands here.',
  text: { offer: 'Thin down their numbers and bring me any fur that you find! I can use it to make a new housecoat. I’m getting a little large for my old one!', prog: 'Rabid Hares. Fur.', done: 'Hah! That’ll teach them.' } });
Q('crazy_mans_palace', { title: 'Crazy Man’s Palace', giver: 'crazy_man', reward: R_(300, 40),
  objectives: [{ t: 'gain', item: 'fire', label: 'Find a source of fire', desc: 'Search the area for a source of fire.', icon: 'torch' },
    { t: 'flag', flag: 'rat_nest_burned', label: 'Burn the rat nest', desc: 'Use your source of fire on the rat nest.', icon: 'rat_nest' }, back('crazy_man', 'The Crazy Man can be found on the first floor of the Forsaken Caves.')],
  note: 'Guide: light the torch first, then burn the nest.',
  text: { offer: 'My cave... my palace! They have taken over! The rats! No more rats!', prog: 'A torch, then the nest.', done: 'My palace! Thank you!' } });
Q('crazy_for_love', { title: 'Crazy for Love', giver: 'crazy_man', pre: ['crazy_mans_palace'], reward: R_(750, 80), alias: '“Carzy for Love” in a 2013 guide', onAccept: { give: { letter_to_finch: 1 } },
  objectives: [{ t: 'event', name: 'mailbox', n: 1, label: 'Deliver letter to Mrs. Finch’s mailbox', desc: 'Mrs. Finch’s mailbox is located on her farm in Goblin Falls.', icon: 'mailbox' }, back('crazy_man', 'The Crazy Man can be found on the first floor of the Forsaken Caves.')],
  text: { offer: 'A letter... for my love! My queen, the lovely Mrs. Finch! To her mailbox! You will take?', prog: 'Her farm, in Goblin Falls.', done: 'Delivered? DELIVERED!' } });
Q('love_letter', { title: 'Love Letter', giver: 'mrs_finch', turnin: 'crazy_man', pre: ['crazy_for_love'], reward: R_(750, 80), onAccept: { give: { love_letter: 1 } }, consume: { love_letter: 1 },
  objectives: [{ t: 'talk', npc: 'crazy_man', label: 'Return Letter to Crazy Man', desc: 'The Crazy Man can be found on the first floor of the Forsaken Caves.', icon: 'npc:crazy_man' }],
  text: { offer: '“This letter must be from that old coot in the caves. Here, take this back to him.”', prog: 'Back to the caves.', done: 'She wrote back! She WROTE BACK!' } });
Q('lead_the_way', { title: 'Lead the Way!', giver: 'mrs_finch', turnin: 'crazy_man', pre: ['love_letter'], reward: R_(750, 80), oev: 'CORROBORATED',
  objectives: [{ t: 'flag', flag: 'finch_following', label: 'Talk to Mrs. Finch', desc: 'After speaking to her, she will follow you.', icon: 'npc:mrs_finch' },
    { t: 'flag', flag: 'finch_delivered', label: 'Take Mrs. Finch to the Crazy Man', desc: 'The Crazy Man can be found on the first floor of the Forsaken Caves.', icon: 'npc:crazy_man' }, { t: 'talk', npc: 'crazy_man', label: 'Talk to the Crazy Man', icon: 'npc:crazy_man' }],
  note: 'No window survives; objectives from the 2013 guide (rewards RECONSTRUCTION).',
  text: { offer: 'Well, I suppose I should go and see him. Lead the way, dear.', prog: 'She follows you. The map works too.', done: 'You brought her! (Mrs. Finch: “Don’t make a fuss.”)' } });
Q('hidden_ring', { title: 'Hidden Ring', giver: 'crazy_man', pre: ['lead_the_way'], reward: R_(1500, 160),
  objectives: [{ t: 'gain', item: 'hidden_ring', label: 'Find Crazy Man’s hidden ring', desc: 'Search for the ring on the first floor of the Forsaken Caves', icon: 'ring' }, back('crazy_man', 'The Crazy Man can be found on the first floor of the Forsaken Caves.')],
  note: 'Guide: the ring is in the bat cave in Forsaken Caves 1.',
  text: { offer: 'Ah...but I have a ring! A ring for my queen! But it is hidden... hee-hee! Where? I don’t remember. You lead!', prog: 'The bat cave.', done: 'My ring!' } });
Q('the_proposal', { title: 'The Proposal', giver: 'crazy_man', turnin: 'mrs_finch', pre: ['hidden_ring'], reward: R_(1500, 160), consume: { hidden_ring: 1 },
  objectives: [{ t: 'talk', npc: 'mrs_finch', label: 'Deliver the ring to Mrs. Finch', desc: 'Mrs. Finch can be found in Goblin Falls.', icon: 'npc:mrs_finch' }],
  text: { offer: 'You will give to her? Hee-hee! Give the ring to my queen!', prog: 'Mrs. Finch, Goblin Falls.', done: 'Oh! Tell him... yes.' } });

/* ---------------- Hermes, the ghosts, Dirk, Big John ---------------- */
Q('weird_science', { title: 'Weird Science', giver: 'hermes', level: 7, reward: R_(250, 80),
  objectives: [buy('alchemist', 'An Alchemist Foundation can be purchased from the store.'), fin('alchemist', 'Complete Alchemist', 'Complete the Alchemist by clicking on the foundation.'), back('hermes', 'Hermes can be found in your home realm.')],
  text: { offer: 'Build me a shop and I can craft crucial consumables that will combust your cranium!', prog: 'An Alchemist foundation.', done: 'Kaboom! I mean, wonderful!' } });
Q('avenge_me', { title: 'Avenge Me!', giver: 'bandit_ghost_alpha', pre: ['break_on_through'], reward: R_(1800, 190),
  objectives: [{ t: 'flag', flag: 'hallway_crossed', label: 'Cross the hallway successfully.', desc: 'Watch your step.', icon: 'question' }],
  note: 'Guide: the doorway with a row of small stone statues; the ghost can be seen after crossing.',
  text: { offer: '“Do what I could not do... reach the other side! Avenge me!”', prog: 'Watch your step.', done: 'You made it... I can rest.' } });
Q('the_journal', { title: 'The Journal', giver: 'bandit_ghost', pre: ['something_missing'], reward: R_(1800, 0),
  objectives: [{ t: 'gain', item: 'journal', label: 'Find the Journal', desc: 'Search the 3rd floor of the Forsaken Caves.', icon: 'journal' }, back('bandit_ghost', 'The Apparition can be found on the 3rd floor of the Caves.')],
  note: 'Guide: the journal is in the bones next to Xorn (bottom-right pile).',
  text: { offer: 'I cannot rest until I recover my journal... I gave it to a comrade as I lay dying. I fear he met the same end.', prog: 'The bones near Xorn.', done: 'My journal... thank you.' } });
Q('milling_about', { title: 'Milling About', giver: 'dirk', level: 10, reward: R_(600, 100),
  objectives: [buy('lumber_mill', 'A Lumber Mill is purchased from the store for gold.'), fin('lumber_mill', 'Build the Lumber Mill', 'Complete the Lumbermill by clicking on the foundation.')],
  text: { offer: 'If you get a Lumber Mill set up, I can help you while you help yourself. You help me, I help you, everyone’s a winner.', prog: 'A Lumber Mill.', done: 'Everyone’s a winner.' } });
Q('metal_mettle', { title: 'Test Your Metal Mettle', giver: 'dirk', pre: ['milling_about'], reward: R_(600, 100),
  objectives: [{ t: 'have', item: 'wood', n: 6, keep: true, label: 'Have 6 Wood', desc: 'Wood can be gathered by chopping trees.', icon: 'wood' },
    { t: 'event', name: 'craftstart_logs', n: 1, label: 'Begin refining Logs', desc: 'Refine wood into logs at the Lumber Mill.', icon: 'logs' }],
  text: { offer: 'Tell you what, get the materials together so I can cut up some sticks and test the mettle of your metal. They’ll come in handy anyway.', prog: 'The Lumber Mill.', done: 'Good mettle.' } });
Q('talk_to_hand', { title: 'Talk to the Hand', giver: 'dirk', turnin: 'big_john', pre: ['metal_mettle'], reward: R_(600, 100),
  objectives: [{ t: 'talk', npc: 'big_john', label: 'Talk to Big John', desc: 'Big John has arrived in your home realm.', icon: 'npc:big_john' }],
  text: { offer: 'He don’t say much, kind of quiet and shy... and if you speak at all... just say hi.', prog: 'Big John.', done: '...hi.' } });
Q('no_lip', { title: 'Don’t Give Him No Lip', giver: 'big_john', pre: ['talk_to_hand'], reward: R_(600, 100),
  objectives: [buy('stone_quarry', 'A Stone Quarry can be purchased from the store.'), fin('stone_quarry', 'Build the Stone Quarry', 'Complete the Stone Quarry by clicking on the foundation.')],
  text: { offer: 'Break rocks.', prog: '...', done: '...good.' } });

/* ---------------- Icy Peaks era: text, objectives and rewards transcribed from the original quest windows (second.zip) ---------------- */
const kill = (enemy, n, label, desc) => ({ t: 'kill', enemy, n, label, desc, icon: 'kill' });
const have = (item, n, label, desc) => ({ t: 'have', item, n, label, desc, icon: item });
Q('giant_hunter', { title: 'Giant Hunter', giver: 'lefty', pre: ['to_arms'], level: 12, reward: R_(1700, 180),
  objectives: [{ t: 'craft', slot: 'weapon', minTier: 4, label: 'Craft a Giant Slayer {wbase}', desc: 'This weapon can be crafted at your Weaponsmith.', icon: 'weapon' }, back('lefty', 'Lefty can be found in your home realm.')],
  text: { offer: 'You WILL run into giants in your travels, its just a fact in this world. Lets make you a special weapon that does extra damage to them.', prog: 'The Weaponsmith. Giant Slayer.', done: 'Now that’s a giant-sticker if ever I saw one.' } });
Q('on_your_offhand', { title: 'On Your Off-hand', giver: 'lefty', pre: ['giant_hunter'], level: 14, reward: R_(1700, 180),
  objectives: [{ t: 'craft', slot: 'offhand', minTier: 5, label: 'Craft a Bone {obase}', desc: 'This off-hand can be crafted at your Weaponsmith.', icon: 'weapon' }, back('lefty', 'Lefty can be found in your home realm.')],
  text: { offer: 'Always good to upgrade your gear.', prog: 'Off-hand, at the Weaponsmith.', done: 'Both hands full. Now you’re a real hero.' } });
Q('chest_protector', { title: 'Chest Protector', giver: 'julius', pre: ['gear_up'], level: 13, reward: R_(1700, 180),
  objectives: [{ t: 'craft', slot: 'armor', minTier: 4, label: 'Craft a Chain of the Swordsman', desc: 'This armor can be crafted at your Armorsmith.', icon: 'tunic' }, back('julius', 'Julius can be found in your home realm.')],
  text: { offer: 'We need to get you some top notch armor. Lets craft a Chain of the Swordsman.', prog: 'The Armorsmith.', done: 'Now THAT is a chest protector.' } });
Q('cover_your_head', { title: 'Cover Your Head', giver: 'julius', pre: ['chest_protector'], level: 13, reward: R_(1700, 180),
  objectives: [{ t: 'craft', slot: 'helmet', minTier: 4, label: 'Craft a Metal Helm', desc: 'This helm can be crafted at your Armorsmith.', icon: 'tunic' }, back('julius', 'Julius can be found in your home realm.')],
  text: { offer: 'A Metal Helm should suit you nicely. Lets get to work on one.', prog: 'The Armorsmith.', done: 'Protected from head to chest.' } });
Q('moms_fur_coat_1', { title: 'Mom’s Fur Coat I', giver: 'gemma', pre: ['rock_and_roll', 'icy_you'], level: 11, reward: R_(940, 110),
  objectives: [have('wolf_pelt', 12, 'Gather 12 Wolf Pelts', 'Wolves can be foudn in the Icy Peaks.'), have('dire_wolf_pelt', 4, 'Gather 4 Dire Wolf Pelts', 'Dire Wolves can be found in the Icy Peaks.'), back('gemma', 'Gemma can be found in Goblin Falls.')],
  text: { offer: 'Listen, my mom’s birthday is coming up and I’d really like to give her a fur coat. Think you could round a few things up for me?', prog: 'Wolves, Icy Peaks.', done: 'So fluffy!' }, chainNext: 'tailor_made' });
Q('tailor_made', { title: 'Tailor Made', giver: 'gemma', turnin: 'julius', pre: ['moms_fur_coat_1'], level: 11, reward: R_(940, 110),
  objectives: [{ t: 'talk', npc: 'julius', label: 'Bring Pelts to Julius', desc: 'Julius can be found in your home realm.', icon: 'npc:julius' }],
  text: { offer: 'Could you bring these to the armorsmith for me? I would be forever grateful!', prog: 'Julius, at home.', done: 'Pelts? A coat? For Mrs. Finch? I accept this challenge.' } });
Q('moms_fur_coat_2', { title: 'Mom’s Fur Coat II', giver: 'julius', pre: ['tailor_made'], level: 11, reward: R_(1155, 150),
  objectives: [have('string', 6, 'Have 6 String', 'String can be crafted at a Workshop.'), have('metal_clasp', 6, 'Have 6 Metal Clasps', 'Metal Clasps can be crafted at a Workshop.'), back('julius', 'Julius can be found in your home realm.')],
  text: { offer: 'Bring me some thread and some stone plugs and I’ll get busy.', prog: 'String and clasps.', done: 'Snip, stitch... perfect.' }, chainNext: 'moms_fur_coat_3' });
Q('moms_fur_coat_3', { title: 'Mom’s Fur Coat III', giver: 'julius', turnin: 'mrs_finch', pre: ['moms_fur_coat_2'], level: 11, reward: R_(1200, 300),
  objectives: [{ t: 'talk', npc: 'mrs_finch', label: 'Bring the coat to Mrs. Finch', desc: 'Mrs. Finch tends to wander.', icon: 'npc:mrs_finch' }],
  text: { offer: 'Deliver this to Gemma’s mom, Mrs. Finch. She tends to wander, good luck finding her.', prog: 'Mrs. Finch.', done: 'A coat? For me? ...Well. It’s adequate.' } });
Q('dire_ear_soup', { title: 'Dire Ear Soup', giver: 'mrs_finch', pre: ['the_proposal', 'icy_you'], level: 12, reward: R_(700, 100),
  objectives: [have('dire_ear', 8, 'Collect 8 Dire Ears', 'Dire Ears can be found on Dire Wolves.'), have('meat', 50, 'Have 50 Meat', 'Meat can be found on various creatures throughout the world'), back('mrs_finch', 'Mrs. Finch tends to wander.')],
  text: { offer: 'He would LOVE my famous dire ear soup. Gather me the ingredients and I’ll get cooking!', prog: 'Dire Wolves have the ears.', done: 'It smells awful. Perfect.' } });
Q('logs_and_bricks', { title: 'Logs and Bricks', giver: 'mrs_finch', pre: ['foul_beasts', 'icy_you'], level: 11, reward: R_(600, 100),
  objectives: [have('logs', 8, 'Create 8 Logs', 'Logs can be created a Lumber Mill'), have('bricks', 8, 'Create 8 Bricks', 'Bricks can created at a Stone Quarry'), back('mrs_finch', 'Mrs. Finch tends to wander.')],
  text: { offer: 'Would you be a dear and drop me some logs and bricks so I can make the dire ear soup?', prog: 'Logs. Bricks.', done: 'Finally, someone competent.' } });
Q('liquid_courage_1', { title: 'Liquid Courage I', giver: 'dryad', pre: ['potent_potables_2', 'icy_you'], level: 11, reward: R_(940, 110),
  objectives: [have('butterfly_wing', 5, 'Have 5 Butterfly Wings', 'Butterfly Wings can be found in various foliage.'), have('pollen', 5, 'Have 5 Pollen', 'Pollen can be found in various foliage.'), back('dryad', 'The Dryad Tree can be found in Goblin Falls.')],
  text: { offer: 'First, I will require Butterfly Wings and Pollen. Bring them to me when you have located both.', prog: 'Goblin Falls bushes, or chests.', done: 'Step one complete.' } });
Q('liquid_courage_2', { title: 'Liquid Courage II', giver: 'dryad', pre: ['liquid_courage_1'], level: 12, reward: R_(1155, 130),
  objectives: [have('hair', 50, 'Have 50 Hair', 'Hair can be found on various creatures in the land.'), have('blood', 50, 'Have 50 Blood', 'Blood can be found on various creatures.'), back('dryad', 'The Dryad Tree can be found in Goblin Falls.')],
  text: { offer: 'Hair and blood is what I need, hair and blood.', prog: 'Hair and blood.', done: 'Disgusting. Wonderful.' } });
Q('liquid_courage_3', { title: 'Liquid Courage III', giver: 'dryad', pre: ['liquid_courage_2'], level: 15, reward: R_(1690, 180, { items: { liquid_courage: 5 } }),
  objectives: [have('ice_heart', 8, 'Get 8 Ice Hearts', 'Ice Hearts can be found on the remains of Ice Golems.'), have('frostbitten_toe', 5, 'Get 5 Frostbitten Toes', 'Frost Giants have been known to have frostbitten toes.'), back('dryad', 'The Dryad Tree can be found in Goblin Falls.')],
  text: { offer: 'One Ice Heart and a Frostbitten Toe, collect them both - now off you go!', prog: 'Ice Golems and Frost Giants.', done: 'Liquid Courage! Do not drink it all at once.' } });

/* ---- Wiz: the main line through the Icy Peaks ---- */
Q('trolldad', { title: 'Trolldad is Trolling', giver: 'wiz', pre: ['icy_you'], level: 11, reward: R_(1155, 300), auto: true, chainNext: 'horn_of_plenty',
  objectives: [kill('trolldad', 1, 'Defeat the Trolldad', 'The Trolldad can be found in the Icy Peaks')],
  text: { offer: 'The boss creatures that hold essences are generally leaders of their class. Find the leader of the trolls and kill him.', prog: 'The Trolldad is somewhere in the Icy Peaks.', done: 'No essence. Hmm. Something else must hold it.' } });
Q('horn_of_plenty', { title: 'Horn of Plenty', giver: 'wiz', pre: ['trolldad'], level: 12, reward: R_(2550, 250), auto: true, chainNext: 'just_abominable',
  objectives: [{ t: 'flag', flag: 'horn_blown', label: 'Blow the Alpenhorn', desc: 'Click on the horn to use.', icon: 'horn' }],
  text: { offer: 'That horn looks suspicious. Should we blow it? We, meaning you. Can’t hurt I suppose, give it a try.', prog: 'Click on the horn to use.', done: 'An avalanche! And a new path.' } });
Q('just_abominable', { title: 'Just Abominable', giver: 'wiz', pre: ['horn_of_plenty'], level: 13, reward: R_(1690, 300, { items: { sapphire: 1 } }), auto: true, chainNext: 'the_ice_castle',
  objectives: [kill('yeti', 1, 'Defeat the Yeti', 'The Yeti’s lair can be found in the Icy Peaks')],
  text: { offer: '...the Yeti. Few have met the Yeti and lived to tell about it. Seek it out and destroy it. Hopefully it will have an essence.', prog: 'The Yeti Cave.', done: 'No essence on the Yeti either.' } });
Q('the_ice_castle', { title: 'The Ice Castle', giver: 'wiz', pre: ['just_abominable'], level: 15, reward: R_(1500, 100), auto: true, chainNext: 'the_frost_king',
  objectives: [kill('frost_giant_guard', 2, 'Defeat Frost Giant Guards', 'Frost Giants are found in the Icy Peaks and the Ice Castle.'), { t: 'enter', area: 'ice_castle', label: 'Enter Ice Castle', desc: 'The Ice Castle is a landmark in the Icy Peaks.', icon: 'castle' }],
  text: { offer: '...the guards ensure that nobody gets in without a proper invitation. Your weapon is your invitation.', prog: 'Giant guards, then the castle (a Frozen Travel Stone opens the gate).', done: 'You’re in.' } });
Q('the_frost_king', { title: 'The Frost King', giver: 'wiz', pre: ['the_ice_castle'], level: 16, reward: R_(3000, 0, { items: { frost_essence: 1 } }), auto: true, chainNext: 'frost_essence_q',
  objectives: [kill('frost_king', 1, 'Kill the Frost King', 'The Frost King lives in the Ice Castle')],
  text: { offer: 'Search for the ruler of this castle and eradicate whatever it is.', prog: 'The Ice Throne Key opens his door.', done: 'The Frost King shatters. A freezing essence floats free.' } });
Q('frost_essence_q', { title: 'Frost Essence', giver: 'wiz', pre: ['the_frost_king'], level: 17, reward: R_(3000, 500), auto: true, chainNext: 'grave_danger',
  objectives: [{ t: 'flag', flag: 'essence_frost', label: 'Place the Frost King essence in your portal.', desc: 'Click on your portal to place the essence in it.', icon: 'frost_essence' }],
  text: { offer: 'Click on your portal to open it up and add the new essence.', prog: 'Home. Portal. Essence.', done: 'Three essences burn in the circle.' } });
Q('grave_danger', { title: 'Grave Danger', giver: 'wiz', pre: ['frost_essence_q'], level: 17, reward: R_(1750, 315), auto: true,
  objectives: [{ t: 'gain', item: 'graveyard_travel_stone', label: 'Craft a Graveyard Travel Stone', desc: 'You can create travel stones and keys in the Mystical Forge.', icon: 'graveyard_travel_stone' }, { t: 'enter', area: 'graveyard1', label: 'Enter the Graveyard', desc: 'The bridge to the Graveyard can be found West of your home realm.', icon: 'bridge' }],
  text: { offer: 'It seems that there are necromancers out there raising the dead. For what reason, I’m not sure... but I’d guess they are blocking passage to where the princess is kept.', prog: 'Mystical Forge, then west of home.', done: 'The Graveyard.' } });

/* ---- Hermit ---- */

/* ===== render.js ===== */
/* render.js — all art is drawn procedurally (original, RECONSTRUCTION in the documented colourful cartoon style).
   No original Zynga / Mob Science assets are used. */
'use strict';
G.R = {};
(function (R) {
  const TAU = Math.PI * 2;
  R.ell = (c, x, y, rx, ry, fill, stroke, lw) => { c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, TAU); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.lineWidth = lw || 1.5; c.strokeStyle = stroke; c.stroke(); } };
  R.rr = (c, x, y, w, h, r, fill, stroke, lw) => { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.lineWidth = lw || 1.5; c.strokeStyle = stroke; c.stroke(); } };
  R.line = (c, x1, y1, x2, y2, col, lw) => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.strokeStyle = col; c.lineWidth = lw || 2; c.lineCap = 'round'; c.stroke(); };
  R.poly = (c, pts, fill, stroke, lw) => { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.lineWidth = lw || 1.5; c.strokeStyle = stroke; c.stroke(); } };
  R.shadow = (c, x, y, r) => R.ell(c, x, y, r, r * 0.38, 'rgba(0,0,0,0.28)');
  const OL = 'rgba(30,20,10,0.75)'; // outline colour

  /* ------------------------------ weapons ------------------------------ */
  R.weapon = function (c, kind, x, y, ang, s, col) {
    c.save(); c.translate(x, y); c.rotate(ang); c.scale(s, s);
    switch (kind) {
      case 'sword': R.rr(c, -1.5, -22, 3, 18, 1, col || '#dfe6e9', OL, 1); R.rr(c, -5, -5, 10, 3, 1, '#b8860b', OL, 1); R.rr(c, -1.5, -2, 3, 6, 1, '#6d4c41'); break;
      case 'axe': R.rr(c, -1.2, -20, 2.4, 22, 1, '#8d6e63', OL, 1); R.poly(c, [1, -20, 9, -22, 9, -10, 1, -12], col || '#b0bec5', OL, 1); break;
      case 'club': R.poly(c, [-2, 2, 2, 2, 4, -16, -4, -16], '#8d6e63', OL, 1); R.ell(c, 0, -16, 4.5, 4.5, '#795548', OL, 1); break;
      case 'spear': R.rr(c, -1, -26, 2, 30, 1, '#8d6e63'); R.poly(c, [0, -32, 3, -25, -3, -25], col || '#cfd8dc', OL, 1); break;
      case 'dagger': R.rr(c, -1, -11, 2, 9, 1, '#eceff1', OL, 1); R.rr(c, -3, -3, 6, 2, 1, '#8d6e63'); break;
      case 'hammer': R.rr(c, -1, -16, 2, 18, 1, '#8d6e63'); R.rr(c, -5, -20, 10, 6, 1, '#78909c', OL, 1); break;
      case 'staff': R.rr(c, -1.3, -28, 2.6, 32, 1, '#8d6e63', OL, 1); R.ell(c, 0, -30, 4, 4, col || '#4fc3f7', '#fff', 1); R.ell(c, -1, -31, 1.4, 1.4, 'rgba(255,255,255,0.8)'); break;
      case 'bow': c.beginPath(); c.arc(0, -8, 13, -1.25, 1.25); c.strokeStyle = col || '#8d6e63'; c.lineWidth = 2.6; c.stroke(); R.line(c, Math.cos(-1.25) * 13, -8 + Math.sin(-1.25) * 13, Math.cos(1.25) * 13, -8 + Math.sin(1.25) * 13, '#eee', 0.8); break;
      case 'bomb': R.ell(c, 0, -4, 5, 5, '#263238', OL, 1); R.line(c, 2, -8, 5, -12, '#ffb300', 1.5); R.ell(c, 5, -12, 1.6, 1.6, '#ff7043'); break;
      case 'shield': R.poly(c, [-7, -10, 7, -10, 7, 0, 0, 7, -7, 0], col || '#795548', OL, 1.2); R.poly(c, [-3, -6, 3, -6, 3, -1, 0, 3, -3, -1], '#ffca28'); break;
      case 'quiver': R.rr(c, -3, -12, 6, 14, 2, col || '#6d4c41', OL, 1); R.line(c, -1.5, -12, -2.5, -17, '#eee', 1); R.line(c, 1.5, -12, 2.5, -17, '#eee', 1); break;
      case 'tome': R.rr(c, -6, -7, 12, 10, 1.5, col || '#6a1b9a', OL, 1); R.rr(c, -5, -6, 2, 8, 0, '#ffd54f'); break;
      case 'cane': R.line(c, 0, 4, 0, -14, '#6d4c41', 2); c.beginPath(); c.arc(-3, -14, 3, 0, Math.PI, true); c.stroke(); break;
    }
    c.restore();
  };

  /* ------------------------------ humanoid (player, NPCs, bandits) ------------------------------ */
  R.humanoid = function (c, x, y, o, t) {
    const s = o.scale || 1, f = o.facing || 1, walk = o.walk || 0;
    c.save(); c.translate(x, y); if (o.alpha != null) c.globalAlpha = o.alpha;
    R.shadow(c, 0, 0, 11 * s);
    c.scale(s * f, s);
    const bob = Math.abs(Math.sin(walk * 2)) * 1.6;
    const legA = Math.sin(walk * 2) * 4, legB = -legA;
    const body = o.outfit || '#7f8c8d', legs = o.legs || G.shade(body, -0.35);
    // legs
    if (!o.robe) { R.rr(c, -5 + legA * 0.3, -9, 4, 9, 2, legs, OL, 1); R.rr(c, 1 + legB * 0.3, -9, 4, 9, 2, legs, OL, 1); R.ell(c, -3 + legA * 0.3, -0.5, 3, 1.6, '#3e2723'); R.ell(c, 3 + legB * 0.3, -0.5, 3, 1.6, '#3e2723'); }
    c.translate(0, -bob);
    // back items
    if (o.cape) R.poly(c, [-7, -22, 7, -22, 9, -4, -9, -4], o.cape, OL, 1);
    if (o.offhand === 'quiver') R.weapon(c, 'quiver', -6, -12, -0.3, 0.9, o.offColor);
    // body
    if (o.robe) R.poly(c, [-7, -22, 7, -22, 10, 0, -10, 0], o.robe, OL, 1.2);
    else R.rr(c, -7, -22, 14, 14, 4, body, OL, 1.2);
    if (o.armorTier != null && o.armorTier > 2) { R.rr(c, -6, -21, 12, 6, 3, G.shade('#b0bec5', o.armorTier > 6 ? -0.2 : 0), null); }
    if (o.apron) R.rr(c, -5, -17, 10, 11, 2, o.apron);
    if (o.shawl) R.poly(c, [-8, -22, 8, -22, 4, -14, -4, -14], o.shawl);
    R.rr(c, -7, -11, 14, 2.5, 1, G.shade(body, -0.45));
    // arms
    const att = o.attack || 0;
    const armAng = -0.2 - att * 1.6;
    c.save(); c.translate(6, -19); c.rotate(armAng);
    R.rr(c, -2, 0, 4, 10, 2, o.robe || body, OL, 1); R.ell(c, 0, 10, 2.4, 2.4, o.skin || '#f2c9a0');
    if (o.weapon) R.weapon(c, o.weapon, 0, 11, o.weapon === 'bow' ? 0.2 - armAng : 0.25, 0.95, o.wColor);
    c.restore();
    c.save(); c.translate(-6, -19); c.rotate(0.25 + att * 0.3);
    R.rr(c, -2, 0, 4, 10, 2, o.robe || body, OL, 1); R.ell(c, 0, 10, 2.4, 2.4, o.skin || '#f2c9a0');
    if (o.offhand === 'shield') R.weapon(c, 'shield', -1, 9, -0.2, 0.9, o.offColor);
    if (o.offhand === 'tome') R.weapon(c, 'tome', 0, 10, -0.1, 0.75, o.offColor);
    if (o.cane) R.weapon(c, 'cane', 0, 10, 0, 1);
    c.restore();
    // head
    const hy = -30;
    if (o.hood) R.ell(c, 0, hy, 10.5, 10.5, o.hood, OL, 1.2);
    R.ell(c, 0, hy, 9, 9, o.skin || '#f2c9a0', OL, 1.2);
    // hair
    if (o.hair && !o.hood && !o.helmet && o.hat !== 'wizard') {
      c.fillStyle = o.hair; c.beginPath(); c.arc(0, hy - 1, 9.3, Math.PI * 1.02, Math.PI * 1.98); c.fill();
      if (o.gender === 'f') { R.rr(c, -10, hy - 3, 4, 13, 2, o.hair); R.rr(c, 6, hy - 3, 4, 11, 2, o.hair); }
      if (o.wild) { for (let i = -3; i <= 3; i++) R.line(c, i * 2.5, hy - 8, i * 3.6, hy - 15 - Math.abs(i), o.hair, 2); }
    }
    // face
    R.ell(c, 3, hy, 1.4, 1.9, o.eye || '#2d1b10'); R.ell(c, -2, hy, 1.4, 1.9, o.eye || '#2d1b10');
    if (o.glasses) { R.ell(c, 3, hy, 2.8, 2.8, null, '#455a64', 1); R.ell(c, -2, hy, 2.8, 2.8, null, '#455a64', 1); }
    if (o.beard) R.poly(c, [-6, hy + 3, 7, hy + 3, 4, hy + 12, 0, hy + 15, -4, hy + 12], o.beard, OL, 1);
    else { c.beginPath(); c.arc(1, hy + 3.5, 2.4, 0.2, Math.PI - 0.2); c.strokeStyle = '#6d3a1f'; c.lineWidth = 1; c.stroke(); }
    if (o.mask) R.rr(c, -7, hy - 4, 14, 7, 2, '#d7ccc8', OL, 1);
    // headwear
    if (o.helmet) { c.fillStyle = o.helmet; c.beginPath(); c.arc(0, hy - 1, 9.8, Math.PI, 0); c.fill(); c.strokeStyle = OL; c.lineWidth = 1; c.stroke(); R.rr(c, -10, hy - 2, 20, 3, 1, G.shade(o.helmet, -0.2)); }
    if (o.hat === 'wizard') { R.poly(c, [-11, hy - 4, 11, hy - 4, 3, hy - 26, -1, hy - 22], o.hatColor || '#4527a0', OL, 1.2); R.ell(c, 2, hy - 13, 1.6, 1.6, '#ffd54f'); R.ell(c, -3, hy - 9, 1.2, 1.2, '#ffd54f'); }

G.regenMs = (kind) => (G.S.settings.timerMode === 'historical' ? G.TICK_MS : kind === 'e' ? 15000 : 10000);

/* ---------------- save / load ---------------- */

/* ---------------- inventory ---------------- */
G.Inv = {

  },
  remove(id, n) {

    if (id === 'gems') { P.gems = Math.max(0, P.gems - n); G.emit('currency'); return; }
    if (id === 'loyalty') { P.loyalty = Math.max(0, P.loyalty - n); G.emit('currency'); return; }

  can(cost) { for (const k in cost) if (G.Inv.count(k) < cost[k]) return false; return true; },
  missing(cost) { const out = []; for (const k in cost) { const have = G.Inv.count(k); if (have < cost[k]) out.push({ id: k, need: cost[k], have }); } return out; },

G.costName = (k) => (k === 'gold' ? 'Gold' : k === 'gems' ? 'Gems' : k === 'loyalty' ? 'Loyalty' : G.itemName(k));

/* ---------------- gear ---------------- */
G.Gear = {
  get(uid) { return G.S.gear.find((g) => g.uid === uid) || null; },
  equipped(slot) { const u = G.S.player.equip[slot]; return u ? G.Gear.get(u) : null; },
  canEquip(it) { return it.slot === 'armor' || it.slot === 'helmet' || it.cls === G.S.player.cls; },
  add(it, silent) { G.S.gear.push(it); if (!silent) G.floatLoot(it.name, G.RARITY.find((r) => r.id === it.rarity).color); G.emit('inv'); G.emit('gainGear', it); return it; },

  unequip(slot) { G.S.player.equip[slot] = null; G.P.invalidate(); G.emit('inv'); },

/* ---------------- derived player stats (RECONSTRUCTION formulas) ---------------- */
G.P = {
  _c: null,
  invalidate() { G.P._c = null; },

    const a = {}; for (const k of ['str', 'dex', 'int', 'luk']) a[k] = cls.base[k] + P.alloc[k] + (P.level - 1);
    let def = 0, hpB = 0, dmg = [2, 4];
    for (const sl of G.SLOTS) { const it = G.Gear.equipped(sl); if (!it) continue; def += it.def || 0; hpB += it.hp || 0; if (it.dmg) dmg = it.dmg; for (const k in it.stats) a[k] += it.stats[k]; }

      maxEnergy: G.maxEnergy(P.level),
      dmgMul: (1 + prim * 0.035) * (cls.dmgFactor || 1),
      hit: G.clamp(0.82 + a.int * 0.004 + (P.cls === 'wizard' ? 0.09 : 0), 0.5, 0.99),
      evade: G.clamp(a.dex * 0.0035 + (P.cls === 'ranger' ? 0.1 : 0), 0, 0.45),
      crit: G.clamp(0.04 + a.luk * 0.0045, 0, 0.6),
      critMul: 1.75,
      range: cls.range, cd: cls.baseCd,
    };
    s.attackRating = Math.round(((s.dmgMin + s.dmgMax) / 2) * s.dmgMul * (1 + s.crit * 0.75) * s.hit * 10);

  },
  gainXP(n) {
    const P = G.S.player; if (P.level >= G.MAX_LEVEL) return;
    P.xp += Math.round(n);
    let leveled = false;
    while (P.level < G.MAX_LEVEL && P.xp >= G.xpToNext(P.level)) {
      P.xp -= G.xpToNext(P.level); P.level++; leveled = true;

  },
  heal(n) { if (!G.player) return; const mx = G.P.stats().maxHp; const before = G.player.hp; G.player.hp = Math.min(mx, G.player.hp + n); const got = Math.round(G.player.hp - before); if (got > 0) G.floatText(G.player.x, G.player.y - 50, '+' + got, '#69f0ae'); },

    const P = G.S.player; const spent = P.alloc.str + P.alloc.dex + P.alloc.int + P.alloc.luk;

  },

/* ---------------- time-based regeneration (VERIFIED: every 2 minutes) ---------------- */
G.tickRegen = function () {

  while (now - G.S.time.eTick >= eMs && guard++ < 500) { G.S.time.eTick += eMs; if (P.energy < st.maxEnergy) P.energy++; }
  if (now - G.S.time.eTick > eMs * 2) G.S.time.eTick = now;

  while (now - G.S.time.hTick >= hMs && guard++ < 500) { G.S.time.hTick += hMs; if (G.player && !G.player.dead && G.player.hp < st.maxHp) G.player.hp = Math.min(st.maxHp, G.player.hp + G.hpRegenPerTick(P.level, st.maxHp)); }

  G.setFlag = function (f, v) {
    if (v === undefined) v = true;
    if (G.S.flags[f] === v) return;

  G.on('equip', (it) => QS.onEvent('equip', it));
  G.on('inv', () => QS.onEvent('inv'));

G.poolFor = (A) => {
  const id = A.id;
  if (id === 'home') return G.MAT_POOLS.home; if (id === 'goblin_falls') return G.MAT_POOLS.goblin_falls; if (id === 'ruins') return G.MAT_POOLS.ruins;

};
G.areaLevel = (A) => Math.round((A.def.lvl[0] + A.def.lvl[1]) / 2);

G.rollChestLoot = function (A, big) {
  const L = G.areaLevel(A), pool = G.poolFor(A);
  G.Inv.add('gold', Math.round((6 + L * 5) * (big ? 6 : 1) * G.rand(0.7, 1.3)));

  if (G.chance(big ? 1 : 0.06)) G.Inv.add('gems', big ? 3 : 1);

  if (!p.quest) return false;
  const list = Array.isArray(p.quest) ? p.quest : [p.quest];
  for (const qg of list) {
    if (!G.QS.isActive(qg.q)) continue;
    const q = G.QUESTS[qg.q]; let blocked = false;
    for (const k in qg.give) {
      const need = q.objectives.find((o) => (o.t === 'gain' || o.t === 'have') && o.item === k);
      if (need && need.t === 'have' && G.Inv.count(k) >= (need.n || 1)) blocked = true;
      if (need && need.t === 'gain' && G.QS.objDone(qg.q, q.objectives.indexOf(need))) blocked = true;
    }
    if (blocked) continue;
    for (const k in qg.give) G.Inv.add(k, qg.give[k]);
    if (!Array.isArray(p.quest)) G.markUsed(p, true);
    G.sfx('quest');
    return true;
  }
  return false;
};

  /* combo ring: clicking repeatedly on your current target */
  C.comboClick = function (e) {

  /* ---------------- enemies ---------------- */
  C.spawnEnemy = function (A, id, x, y, opts) {
    const d = G.ENEMIES[id]; if (!d) { console.warn('no enemy', id); return null; }
    opts = opts || {};
    const st = G.enemyStats(d, opts.lvl);
    const e = { kind: 'enemy', uid: G.uid('e'), id, def: d, lvl: st.lvl, x, y, hx: x, hy: y, hp: st.hp, maxHp: st.hp, dmg: st.dmg, defR: st.def, xp: st.xp, gold: st.gold,
      state: 'idle', target: null, cd: G.rand(0.3, 1.2), path: [], repath: 0, wanderT: G.rand(1, 4), facing: G.chance(0.5) ? 1 : -1, walk: Math.random() * 10, att: 0, flash: 0,
      stun: 0, slow: 0, frozen: 0, radius: 12 * (d.scale || 1), boss: !!d.boss, elite: !!d.elite, bossId: opts.bossId || null, group: opts.group, temp: !!opts.temp, seed: Math.random() * 10,
      abil: (d.abilities || []).map((a) => ({ a, cd: a.cd * G.rand(0.4, 0.8) })), summonCd: d.summon ? d.summon.every * 0.6 : 0, summons: [], visible: !d.invisible, invisible: !!d.invisible, hidden: 0, owner: opts.owner || null };

  };
  C.populate = function (A) {
    A.enemies = [];
    let gi = 0;
    for (const s of A.spawnDefs) {
      gi++;
      for (let i = 0; i < s.n; i++) {
        let tx = s.x, ty = s.y;
        for (let k = 0; k < 12; k++) { const ax = s.x + G.randi(-s.r, s.r), ay = s.y + G.randi(-s.r, s.r); if (G.W.walkable(A, ax, ay)) { tx = ax; ty = ay; break; } }
        [tx, ty] = G.W.nearestFree(A, tx, ty);
        C.spawnEnemy(A, s.e, (tx + 0.5) * T, (ty + 0.6) * T, { group: gi });
      }
    }
    for (const b of A.bossDefs) {
      if (G.bossDown(b.id)) continue;
      const [tx, ty] = G.W.nearestFree(A, b.x, b.y);

  C.aggro = function (e, target) {

  };

  C.damageEnemy = function (e, r, src) {

    e.hp -= r.dmg; e.flash = 1; e.lastHit = G.time; e.visible = true;
    G.floatText(e.x + G.rand(-8, 8), e.y - 40 * (e.def.scale || 1), (r.crit ? r.dmg + '!' : '' + r.dmg), r.crit ? '#ffeb3b' : '#ffffff', r.crit ? 18 : 14);
    if (src && src.kind === 'ally' && Math.random() < 0.4) { e.state = 'chase'; e.target = src; } else C.aggro(e, G.player);
    if (G.player) G.player.lastCombat = G.time;

      // quest drops described in the original quest windows

      if (/ooze/.test(e.id) && G.QS.isActive('potent_potables_1') && Math.random() < 0.8) C.drop(A, e.x, e.y, { item: 'purified_acid', n: 1 });
      if (e.id === 'spider_queen' && G.QS.isActive('potent_potables_2')) C.drop(A, e.x, e.y, { item: 'golden_silk', n: 1 });
      if (['goblin_minion', 'goblin_archer', 'goblin_guard', 'goblin_sapper', 'goblin_shaman', 'barghest', 'rat', 'bat', 'ruffian'].includes(e.id) && G.QS.isActive('at_your_service')) { if (Math.random() < 0.45) C.drop(A, e.x, e.y, { item: 'blood', n: 1 }); if (Math.random() < 0.45) C.drop(A, e.x, e.y, { item: 'hair', n: 1 }); }
      const orbP = d.orbs || 0.22;
      if (Math.random() < orbP) C.drop(A, e.x, e.y, { orb: 'hp' });
      if (Math.random() < orbP * 0.6) C.drop(A, e.x, e.y, { orb: 'en' });
      const gearP = e.boss ? 1 : e.elite ? 0.8 : 0.1;
      if (Math.random() < gearP) {
        const n = e.boss ? 2 : 1;
        for (let i = 0; i < n; i++) C.drop(A, e.x, e.y, { gear: G.makeGear({ slot: G.pick(G.SLOTS), cls: Math.random() < 0.75 ? G.S.player.cls : G.pick(Object.keys(G.CLASSES)), lvl: e.lvl, rarity: e.boss ? G.pick(['rare', 'rare', 'epic']) : undefined }) });
      }

    }

    G.QS.onKill(e.id);

  };

  C.drop = function (A, x, y, o) {
    const ang = Math.random() * Math.PI * 2, r = G.rand(10, 36);
    A.drops.push(Object.assign({ kind: 'drop', x: x + Math.cos(ang) * r, y: y + Math.sin(ang) * r * 0.6, sx: x, sy: y, t: 0, uid: G.uid('d') }, o));
  };
  C.pickup = function (d) {

    else if (d.orb === 'en') { G.P.addEnergy(2); G.floatText(G.player.x, G.player.y - 60, '+2 Energy', '#ffee58', 12); G.sfx('pickup'); }
    else if (d.gear) { G.Gear.add(d.gear); G.sfx('pickup'); }
    else { G.Inv.add(d.item, d.n); G.sfx(d.item === 'gold' ? 'coin' : 'pickup'); }
  };

  C.updateEnemy = function (e, dt) {
    const p = G.player, d = e.def;
    if (e.dead) { e.deadT += dt; if (e.deadT > 0.6) e.removed = true; return; }
    e.flash = Math.max(0, e.flash - dt * 5); e.att = Math.max(0, e.att - dt * 4);
    if (e.slow > 0) e.slow -= dt; if (e.frozen > 0) e.frozen -= dt;
    if (e.invisible) e.visible = (p && dist(e, p) < 4.5 * T) || G.time - (e.lastHit || -99) < 2.5 || e.state === 'chase' && dist(e, p) < 6 * T;
    if (e.hidden > 0) { e.hidden -= dt; if (e.hidden <= 0 && e.burrowTo) { e.x = e.burrowTo.x; e.y = e.burrowTo.y; e.burrowTo = null; C.bossSlam(e, { radius: 2.4, mult: 1.6 }); } return; }
    if (e.stun > 0) { e.stun -= dt; return; }
    const target = e.target && !e.target.dead && !e.target.removed ? e.target : p;
    if (!p || p.dead) { e.state = 'return'; }
    // aggro check
    if (e.state === 'idle' && p && !p.dead && d.agg > 0 && dist(e, p) < d.agg * T) C.aggro(e, p);
    // quirk: hovering the cursor over an enemy freezes its movement (historical exploit, optional)
    const quirkHold = G.S.settings.quirks && G.hoverEnemy === e;
    const spd = d.spd * T * (e.slow > 0 ? 0.5 : 1);
    if (e.state === 'idle') {
      if (d.spd <= 0) return;
      e.wanderT -= dt;
      if (e.wanderT <= 0) { e.wanderT = G.rand(2, 5); const wx = e.hx + G.rand(-2.5, 2.5) * T, wy = e.hy + G.rand(-2.5, 2.5) * T; if (G.W.walkablePx(G.A, wx, wy)) e.path = [[Math.floor(wx / T), Math.floor(wy / T)]]; }
      if (!quirkHold) C.moveAlong(e, dt, spd * 0.4);
      return;
    }
    if (e.state === 'return') {
      if (!e.path.length) C.pathTo(e, e.hx, e.hy);
      C.moveAlong(e, dt, spd * 1.2); e.hp = Math.min(e.maxHp, e.hp + e.maxHp * dt * 0.25);
      if (Math.hypot(e.x - e.hx, e.y - e.hy) < T) { e.state = 'idle'; e.path = []; e.target = null; }

    for (const ab of e.abil) { ab.cd -= dt; if (ab.cd <= 0 && dist(e, target) < 9 * T) { ab.cd = ab.a.cd * G.rand(0.9, 1.2); if (C.ability(e, ab.a, target)) return; } }
    if (d.summon) { e.summonCd -= dt; e.summons = e.summons.filter((s) => !s.dead && !s.removed); if (e.summonCd <= 0 && e.summons.length < d.summon.max) { e.summonCd = d.summon.every; C.summon(e, d.summon.id, 1); } }

    }
  };

  C.enemyAttack = function (e, target) {
    const d = e.def; e.att = 1;
    const hit = () => C.hitTarget(target, e, 1);
    if (d.proj) C.projectile({ from: 'enemy', x: e.x, y: e.y - 24 * (d.scale || 1), target, kind: d.proj, speed: (d.proj === 'bomb' || d.proj === 'rock' ? 7 : 9) * T, src: e, onHit: (t) => { C.hitTarget(t, e, 1); if (d.root && t.kind === 'player') t.root = Math.max(t.root, d.root); if (d.proj === 'bomb') G.fx({ t: 'burst', x: t.x, y: t.y - 10, col: '#ff7043', r: 30 }); } });
    else G.after(0.12, () => { if (!e.dead && e.stun <= 0 && dist(e, target) < (d.range || 1.2) * T + 30) hit(); });
  };

  C.hitTarget = function (t, e, mult) {
    if (!t || t.dead) return;
    if (t.kind === 'player') return C.damagePlayer(e.dmg * mult * G.rand(0.85, 1.15), e);
    if (t.kind === 'ally') { t.hp -= Math.max(1, e.dmg * mult * 0.8 * G.rand(0.85, 1.15)); t.flash = 1; if (t.hp <= 0) C.allyDown(t); }
  };

  C.damagePlayer = function (raw, e) {
    const p = G.player; if (!p || p.dead) return;
    if (G.godMode) { p.lastCombat = G.time; return; }
    const st = G.P.stats();
    p.lastCombat = G.time;
    if (Math.random() < st.evade) { G.floatText(p.x, p.y - 50, 'Dodge', '#80deea', 13); return; }
    const red = st.def / (st.def + 30 + (e ? e.lvl : 1) * 7);
    const dmg = Math.max(1, Math.round(raw * (1 - red)));
    p.hp -= dmg; p.flash = 1;
    G.floatText(p.x + G.rand(-6, 6), p.y - 50, '-' + dmg, '#ff5252', 14);
    if (e && e.def.lifesteal) e.hp = Math.min(e.maxHp, e.hp + dmg * e.def.lifesteal);
    if (e && e.def.stunHit && Math.random() < e.def.stunHit) { p.stun = 0.8; G.floatText(p.x, p.y - 66, 'Stunned!', '#ffd54f', 12); }
    if (e && e.def.slowHit && Math.random() < e.def.slowHit) p.slow = 2;
    G.sfx('hurt');
    if (p.hp <= 0) C.playerDie();
  };

  C.playerDie = function () {
    const p = G.player; p.hp = 0; p.dead = true; p.target = null; p.path = []; G.sfx('die');
    for (const e of G.A.enemies) if (e.state === 'chase') { e.state = 'return'; e.path = []; }
    setTimeout(() => G.UI.deathDialog(), 700);
  };
  C.revive = function (mode) {
    const p = G.player, P = G.S.player, mx = G.P.stats().maxHp;
    if (mode === 'full') { if (!G.Inv.pay({ gems: 5 })) return G.toast('Not enough gems.', 'warn'); p.hp = mx; }
    else if (mode === 'half') { if (P.freeRevive > 0) P.freeRevive--; else if (!G.Inv.pay({ gems: 2 })) return G.toast('Not enough gems.', 'warn'); p.hp = Math.round(mx * 0.5); }
    else { p.dead = false; p.hp = 1; G.travel('home'); G.UI.closeModal(); return true; }
    p.dead = false; p.flash = 1; G.fx({ t: 'ring', x: p.x, y: p.y, col: '#69f0ae', r: 60, life: 0.6 }); G.UI.closeModal(); return true;
  };

  /* boss abilities (RECONSTRUCTION: original patterns unknown) */
  C.bossSlam = function (e, a) {
    const r = (a.radius || 2.5) * T, x = e.x, y = e.y;
    G.fx({ t: 'telegraph', x, y, r, life: 0.8, col: '#ff1744' });
    G.after(0.8, () => { if (e.dead || !G.A) return; G.fx({ t: 'ring', x, y, col: a.slow ? '#81d4fa' : '#ffab91', r, life: 0.4 }); G.shake(7);
      for (const t of [G.player].concat(G.party || [])) if (t && !t.dead && Math.hypot(t.x - x, t.y - y) < r) { C.hitTarget(t, e, a.mult || 1.8); if (a.slow && t.kind === 'player') t.slow = 3; } });
  };
  C.summon = function (e, id, n) {
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2, x = e.x + Math.cos(ang) * 40, y = e.y + Math.sin(ang) * 30;
      if (!G.W.walkablePx(G.A, x, y)) continue;
      const s = C.spawnEnemy(G.A, id, x, y, { temp: true, owner: e, group: e.group, lvl: Math.max(1, e.lvl - 2) });

  C.ability = function (e, a, target) {
    switch (a.t) {
      case 'slam': case 'nova': C.bossSlam(e, a); return false;
      case 'summon': if (e.summons.filter((s) => !s.dead).length < 4) C.summon(e, a.id, a.n || 1); return false;
      case 'webs': C.projectile({ from: 'enemy', x: e.x, y: e.y - 20, target, kind: 'web', speed: 8 * T, src: e, onHit: (t) => { C.hitTarget(t, e, 0.6); if (t.kind === 'player') { t.root = 2; G.floatText(t.x, t.y - 66, 'Webbed!', '#eceff1', 12); } } }); return false;
      case 'rocks': {
        for (let i = 0; i < a.n; i++) { const ang = Math.atan2(target.y - e.y, target.x - e.x) + (i - (a.n - 1) / 2) * 0.28; const tx = e.x + Math.cos(ang) * 7 * T, ty = e.y + Math.sin(ang) * 7 * T;
          C.projectile({ from: 'enemy', x: e.x, y: e.y - 30, tx, ty, kind: a.proj || 'rock', speed: 7.5 * T, src: e, radius: 22, onHit: (t) => C.hitTarget(t, e, a.mult || 1) }); }
        return false;
      }
      case 'burrow': {
        e.hidden = 1.2; e.burrowTo = { x: target.x + G.rand(-20, 20), y: target.y + G.rand(-10, 10) };
        if (!G.W.walkablePx(G.A, e.burrowTo.x, e.burrowTo.y)) e.burrowTo = { x: target.x, y: target.y };
        G.fx({ t: 'burst', x: e.x, y: e.y - 6, col: '#8d7b68', r: 40 }); G.shake(5); if (G.player.target === e) { /* keep targeting */ }

  /* ---------------- projectiles ---------------- */
  C.projectile = function (o) { if (!G.A) return; G.A.projs.push(Object.assign({ t: 0, life: 3 }, o)); };
  C.updateProjs = function (dt) {
    const A = G.A;
    for (const pr of A.projs) {
      pr.t += dt;
      let tx, ty;
      if (pr.target) { if (pr.target.dead || pr.target.removed) { pr.done = true; continue; } tx = pr.target.x; ty = pr.target.y - 18; } else { tx = pr.tx; ty = pr.ty; }
      const dx = tx - pr.x, dy = ty - pr.y, d = Math.hypot(dx, dy), step = pr.speed * dt;
      pr.ang = Math.atan2(dy, dx);
      if (d <= step + 6) {
        pr.done = true;
        if (pr.target) pr.onHit(pr.target);
        else { G.fx({ t: 'burst', x: tx, y: ty, col: pr.kind === 'ice' ? '#81d4fa' : pr.kind === 'hex' ? '#ce93d8' : '#a1887f', r: pr.radius || 18 });
          for (const t of [G.player].concat(G.party || [])) if (t && !t.dead && Math.hypot(t.x - tx, t.y - 18 - ty) < (pr.radius || 18) + 10) pr.onHit(t); }
        continue;
      }
      pr.x += (dx / d) * step; pr.y += (dy / d) * step;
      if (pr.t > pr.life) pr.done = true;
    }
    A.projs = A.projs.filter((p) => !p.done);
  };

  /* ---------------- companions (Tavern) ----------------
     VERIFIED: up to 2 AI companions; friend allies ~5m30s, mercenaries ~10m30s; Warriors tank and stun by charging,
     Wizards cast slowing ice bolts, Rangers shoot from the back; strength depends on both your level and theirs. */
  C.makeAlly = function (o) {
    const P = G.S.player.level;
    const eff = Math.min(P + 2, Math.round((o.lvl + P) / 2));
    const hpMul = o.cls === 'warrior' ? 1.4 : o.cls === 'wizard' ? 0.85 : 1;
    const a = Object.assign({ kind: 'ally', x: G.player.x + G.rand(-30, 30), y: G.player.y + G.rand(-20, 20), path: [], facing: 1, walk: 0, att: 0, flash: 0, cd: 1, scd: 3, eff,
      maxHp: Math.round((60 + eff * 17) * hpMul), dmg: 4 + eff * 2.3, radius: 12, uid: G.uid('a') }, o);
    if (a.hp == null) a.hp = a.maxHp;
    return a;
  };
  C.allyDown = function (a) { a.dead = true; G.party = G.party.filter((m) => m !== a); G.toast(a.name + ' has fallen and returns to the Tavern.', 'warn'); G.emit('party'); };

  U.act = function (a, d, el) {

  CI.MENU_AT = 7.4;

/* Title screen built on the cinematic (replaces the old static title). Same buttons and actions as before. */
(function (U) {

    const auto = navigator.webdriver || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) || U._introSeen;
    t.innerHTML = `<canvas id="cinecv" aria-label="Opening cinematic: a dragon breathes fire over the kingdom"></canvas>
      <button class="cskip" data-act="cskip">Skip ▸</button>
      <div class="tmenu" hidden><div class="tbtns">${has ? '<button data-act="tcont">Continue</button>' : ''}<button class="${has ? 'alt' : ''}" data-act="tnew">New hero</button><button class="alt" data-act="timport">Import save</button></div>

/* ===== boot.js ===== */
/* boot.js — start-up: title screen, loading a save, entering the world. */
'use strict';
G.boot = function (fromSave) {
  if (fromSave) {
    const S = G.loadRaw();
    if (!S) { G.toast('No save found. Starting a new hero.'); G.UI.creation(); return; }
    G.S = S;
  }
  G.player = null; G.A = null; G.party = [];
  document.getElementById('title').hidden = true;
  G.UI.buildHud();
  G.P.invalidate();
  G.Home.restoreParty();
  const pos = fromSave && G.S.pos ? G.S.pos : null;
  G.travel(G.S.area || 'home', null, { pos, noSave: true });
  G.player.hp = G.clamp(G.S.player.hp || G.P.stats().maxHp, 1, G.P.stats().maxHp);
  if (!fromSave) { G.player.hp = G.P.stats().maxHp; G.UI.toast('Welcome, ' + G.esc(G.S.player.name) + '! Click <b>Wiz</b> (the wizard with the gold <b>!</b>) to begin.', 'quest', 9000); }
  G.UI.renderParty(); G.UI.renderTracker();
  G.QS.checkAll();
  G.save();
};

window.addEventListener('DOMContentLoaded', () => {
  G.initCanvas();
  G.UI.init();
  const t = document.getElementById('title'); t.hidden = false; t.innerHTML = '<div class="tbox"><h1>Loading\u2026</h1></div>';
  G.SPR.load(() => { G.UI.title(); });
  G.startLoop();
});
